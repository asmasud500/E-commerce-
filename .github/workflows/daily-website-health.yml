name: Daily Website Health Audit

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-website-health
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production website
        id: probe
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = 'https://ecommerce-platform.masud50003.workers.dev';
          const checks = [
            { name: 'Storefront', path: '/', test: async (r) => r.ok },
            { name: 'Application and database health', path: '/api/health', test: async (r) => { if (!r.ok) return false; const d = await r.json(); return d.status === 'ok' && d.database === 'reachable'; } },
            { name: 'Store configuration', path: '/api/storefront/config', test: async (r) => { if (!r.ok) return false; const d = await r.json(); return !!d.settings && Array.isArray(d.zones); } },
            { name: 'Product catalogue API', path: '/api/products?limit=1', test: async (r) => { if (!r.ok) return false; const d = await r.json(); return Array.isArray(d.items) && typeof d.total === 'number' && typeof d.pages === 'number'; } },
            { name: 'Categories API', path: '/api/categories', test: async (r) => r.ok && Array.isArray(await r.json()) },
            { name: 'Payment methods API', path: '/api/payment-gateways', test: async (r) => r.ok && Array.isArray(await r.json()) }
          ];
          (async () => {
            const results = await Promise.all(checks.map(async (c) => {
              const start = Date.now();
              try {
                const r = await fetch(new URL(c.path, base), { signal: AbortSignal.timeout(10000), headers: { accept: 'application/json' } });
                let valid = false;
                try { valid = await c.test(r); } catch { valid = false; }
                return { name: c.name, path: c.path, status: valid ? 'PASS' : 'FAIL', http: r.status, ms: Date.now() - start };
              } catch (e) {
                return { name: c.name, path: c.path, status: 'FAIL', http: 'no response', ms: Date.now() - start, error: e.name === 'TimeoutError' ? 'Timed out after 10 seconds' : 'Network/request failure' };
              }
            }));
            const failures = results.filter(r => r.status === 'FAIL');
            const report = [
              '# MART production website health audit',
              '',
              'Checked at: ' + new Date().toISOString(),
              'Target: ' + base,
              '',
              '| Check | Result | HTTP | Latency |',
              '|---|---|---:|---:|',
              ...results.map(r => '| ' + r.name + ' (' + r.path + ') | ' + r.status + ' | ' + r.http + ' | ' + r.ms + ' ms |' + (r.error ? ' ' + r.error : '')),
              '',
              failures.length ? '## Action required\n' + failures.map(r => '- **' + r.name + '**: ' + (r.error || ('HTTP ' + r.http + ' or unexpected response shape'))).join('\n') : 'All configured production smoke checks passed.'
            ].join('\n');
            fs.writeFileSync('/tmp/mart-health-report.md', report);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'failed=' + (failures.length ? 'true' : 'false') + '\n');
            if (failures.length) process.exitCode = 1;
          })();
          NODE
      - name: Create or update health issue when checks fail
        if: always() && steps.probe.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/mart-health-report.md', 'utf8');
            const title = '[Automated Health Audit] Production website check failed';
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const issue = existing.data.find(item => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              core.info('Updated existing health audit issue #' + issue.number);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: [] });
              core.info('Created health audit issue #' + created.data.number);
            }
      - name: Fail workflow when a production check fails
        if: steps.probe.outputs.failed == 'true'
        run: |
          echo "Production health checks failed. See the report above and the automated GitHub issue."
          exit 1
