name: Debug - capture live Worker logs
on:
  workflow_dispatch:
    inputs:
      path:
        description: "API path to hit"
        required: true
        default: "/api/customer/auth/login"
      body:
        description: "JSON body to POST"
        required: true
        default: '{"email":"abusalehmasud20@gmail.com","password":"wrongpass123"}'
jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Capture tail while hitting the endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler tail --format pretty > /tmp/tail.log 2>&1 &
          TAIL_PID=$!
          sleep 8
          curl -s -X POST "https://ecommerce-platform.masud50003.workers.dev${{ github.event.inputs.path }}" \
            -H "Content-Type: application/json" \
            -d '${{ github.event.inputs.body }}' -o /tmp/response.json -w "\nHTTP_STATUS:%{http_code}\n" | tee -a /tmp/tail.log
          sleep 10
          kill $TAIL_PID || true
          sleep 2
          mkdir -p debug-output
          cp /tmp/tail.log debug-output/tail.log
          cp /tmp/response.json debug-output/response.json
      - name: Commit debug output
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          git config user.email "bot@debug.dev"
          git config user.name "Debug Bot"
          git checkout -B debug-logs
          git add debug-output
          git commit -m "debug: capture tail output" || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/asmasud500/E-commerce-.git"
          git push -f origin debug-logs
