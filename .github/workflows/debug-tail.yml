name: Debug - capture live Worker logs

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      path:
        description: "API path to hit"
        required: true
        default: "/products"
      body:
        description: "JSON body for POST requests; use {} for GET"
        required: true
        default: "{}"

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Capture tail while hitting the endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PATH_TO_HIT="${{ github.event.inputs.path || '/products' }}"
          BODY="${{ github.event.inputs.body || '{}' }}"
          npx wrangler tail --format pretty > /tmp/tail.log 2>&1 &
          TAIL_PID=$!
          sleep 8
          if [ "$BODY" = "{}" ]; then
            curl -s -X GET "https://e-commerce-platform-masud5003.workers.dev$PATH_TO_HIT" -o /tmp/response.json -w "\nHTTP_STATUS:%{http_code}\n" | tee -a /tmp/tail.log
          else
            curl -s -X POST "https://e-commerce-platform-masud5003.workers.dev$PATH_TO_HIT" -H "Content-Type: application/json" -d "$BODY" -o /tmp/response.json -w "\nHTTP_STATUS:%{http_code}\n" | tee -a /tmp/tail.log
          fi
          sleep 10
          kill $TAIL_PID || true
          sleep 2
          mkdir -p debug-output
          cp /tmp/tail.log debug-output/tail.log
          cp /tmp/response.json debug-output/response.json
      - name: Commit debug output
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          git config user.email "bot@debug.dev"
          git config user.name "Debug Bot"
          git checkout -B debug-logs
          git add debug-output
          git commit -m "debug: capture products runtime output" || true
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/asmasud500/E-commerce-.git"
          git push -f origin debug-logs
