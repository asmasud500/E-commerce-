name: Temporary Cloudflare error capture

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
    branches: ["main"]

jobs:
  tail:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture Worker exceptions for 5 minutes
        run: |
          mkdir -p debug-output
          timeout 300s npx wrangler tail ecommerce-platform --format json --status error --sampling-rate 1 > debug-output/cloudflare-tail.jsonl 2>&1 || true
          date -u > debug-output/capture-finished.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-error-capture-${{ github.event.workflow_run.id }}
          path: debug-output/
