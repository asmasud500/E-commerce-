name: Temporary Cloudflare error capture

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tail logs while user retries
        run: |
          (timeout 200s npx wrangler tail ecommerce-platform --format json > /tmp/tail.jsonl 2>&1 || true) &
          wait || true
          sed -n "/^{/,\$p" /tmp/tail.jsonl | jq -r 'select(.event.request.url!=null)|(.event.request.method+" "+.event.request.url+" -> "+((.event.response.status//0)|tostring)+" | "+([.logs[]?.message|map(tostring)|join(" ")]|join(" ## "))+" | "+([.exceptions[]?.message]|join(" ## ")))' 2>/dev/null | grep -v "_next/static" | head -c 4500 > /tmp/sum.txt
          echo "::error::$(tr '\n' '|' < /tmp/sum.txt | sed 's/%/%25/g')"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
