name: Temporary Cloudflare error capture

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hit pages while tailing
        run: |
          B=https://ecommerce-platform.masud50003.workers.dev
          (timeout 60s npx wrangler tail ecommerce-platform --format json > /tmp/tail.jsonl 2>&1 || true) &
          sleep 20
          for p in /products "/products?q=a" /; do echo "::notice::$p -> $(curl -s -o /tmp/r.html -w '%{http_code}' "$B$p") app-error=$(grep -c 'Application error' /tmp/r.html || true)"; done
          curl -s -X POST "$B/api/customer/auth/login" -H 'content-type: application/json' -d '{"email":"nobody@example.com","password":"wrongpass123"}' | head -c 500 | sed "s/^/::notice::login: /"; echo
          sleep 25
          wait || true
          jq -c 'select(.event.request.url!=null)|{u:.event.request.url,s:.event.response.status,l:[.logs[]?.message],e:[.exceptions[]?.message]}' /tmp/tail.jsonl 2>/dev/null | head -c 3000 > /tmp/sum.txt || true
          curl -s "$B/products" | grep -o '[0-9]* available' | head -1 >> /tmp/sum.txt || true
          echo "::error::$(tr '\n' '|' < /tmp/sum.txt | sed 's/%/%25/g')"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
