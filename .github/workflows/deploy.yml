name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: ["main"]

# Prevent overlapping Worker deployments and secret updates.
concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Validate required production secrets
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for key in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID ADMIN_EMAIL ADMIN_PASSWORD ADMIN_SESSION_SECRET PAYMENT_ENCRYPTION_KEY PAYMENT_WEBHOOK_SECRET CRON_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key:-}" ]; then echo "::error::Required repository secret is missing: $key"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Required production secrets are present (values are not printed)."
      - name: Run security and type checks
        run: |
          npm run test:security
          npx tsc --noEmit
      - name: Build for Cloudflare
        run: npm run cf:build
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set application runtime secrets
        run: |
          printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          printf '%s' "$ADMIN_SESSION_SECRET" | npx wrangler secret put ADMIN_SESSION_SECRET
          printf '%s' "$PAYMENT_ENCRYPTION_KEY" | npx wrangler secret put PAYMENT_ENCRYPTION_KEY
          put_optional_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "$name not configured; related integration remains disabled."
            fi
          }
          put_optional_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put_optional_secret TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
          put_optional_secret TELEGRAM_ADMIN_USER_IDS "$TELEGRAM_ADMIN_USER_IDS"
          put_optional_secret TELEGRAM_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET"
          printf '%s' "$PAYMENT_WEBHOOK_SECRET" | npx wrangler secret put PAYMENT_WEBHOOK_SECRET
          put_optional_secret MOBILE_MONEY_SMS_WEBHOOK_SECRET "$MOBILE_MONEY_SMS_WEBHOOK_SECRET"
          printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_USER_IDS: ${{ secrets.TELEGRAM_ADMIN_USER_IDS }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          MOBILE_MONEY_SMS_WEBHOOK_SECRET: ${{ secrets.MOBILE_MONEY_SMS_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Register store Telegram webhook and commands
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_WEBHOOK_SECRET:-}" ]; then
            echo "Telegram webhook registration skipped: TELEGRAM_BOT_TOKEN and TELEGRAM_WEBHOOK_SECRET must both be configured."
            exit 0
          fi
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          URL="https://ecommerce-platform.masud50003.workers.dev/api/telegram/webhook"
          curl --fail --silent --show-error -X POST "$API/setWebhook" -H 'content-type: application/json' \
            -d "{\"url\":\"$URL\",\"secret_token\":\"$TELEGRAM_WEBHOOK_SECRET\",\"allowed_updates\":[\"message\",\"callback_query\"],\"drop_pending_updates\":true}" | tee /dev/stderr | jq -e '.ok == true' > /dev/null
          curl --fail --silent --show-error -X POST "$API/setMyCommands" -H 'content-type: application/json' \
            -d '{"commands":[{"command":"start","description":"Start"},{"command":"help","description":"Help"},{"command":"orders","description":"Recent orders"},{"command":"pending","description":"Pending orders"},{"command":"today","description":"Today summary"},{"command":"sales","description":"Sales report"},{"command":"stock","description":"Low stock"},{"command":"search","description":"Search orders"}]}' | tee /dev/stderr | jq -e '.ok == true' > /dev/null
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

      - name: Verify production storefront and Firestore readiness
        run: |
          set -euo pipefail
          BASE_URL="https://ecommerce-platform.masud50003.workers.dev"
          for attempt in $(seq 1 8); do
            if curl --fail --silent --show-error --output /dev/null "$BASE_URL/"; then break; fi
            if [ "$attempt" -eq 8 ]; then echo "Storefront smoke test failed"; exit 1; fi
            sleep 10
          done
          curl --fail --silent --show-error "$BASE_URL/api/health" --output /tmp/health.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));if(d.status!=="ok"||d.database!=="reachable")throw new Error("Firestore readiness check failed");console.log("Firestore readiness check passed.")'
          curl --fail --silent --show-error "$BASE_URL/api/storefront/config" --output /tmp/storefront-config.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/storefront-config.json","utf8"));if(!d.settings||!Array.isArray(d.zones))throw new Error("Storefront config response is invalid");console.log("Storefront configuration smoke test passed.")'
          curl --fail --silent --show-error "$BASE_URL/api/products?limit=1" --output /tmp/products.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/products.json","utf8"));if(!Array.isArray(d.items)||typeof d.total!=="number"||typeof d.pages!=="number")throw new Error("Product catalogue response is invalid");console.log("Product catalogue API smoke test passed; returned total="+d.total+".")'
          curl --fail --silent --show-error "$BASE_URL/api/categories" --output /tmp/categories.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/categories.json","utf8"));if(!Array.isArray(d))throw new Error("Categories API response is invalid");console.log("Categories API smoke test passed; returned count="+d.length+".")'
