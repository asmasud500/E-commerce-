name: Deploy to Cloudflare Workers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Prevent overlapping Worker deployments and secret updates.
concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Validate required production secrets
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_CLIENT_EMAIL: ${{ secrets.GOOGLE_DRIVE_CLIENT_EMAIL }}
          GOOGLE_DRIVE_PRIVATE_KEY: ${{ secrets.GOOGLE_DRIVE_PRIVATE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for key in FIREBASE_PROJECT_ID FIREBASE_CLIENT_EMAIL FIREBASE_PRIVATE_KEY ADMIN_EMAIL ADMIN_PASSWORD ADMIN_SESSION_SECRET PAYMENT_ENCRYPTION_KEY PAYMENT_WEBHOOK_SECRET CRON_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key:-}" ]; then echo "::error::Required repository secret is missing: $key"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::notice::GEMINI_API_KEY is not configured in GitHub Actions; Gemini features will not be connected."
          else
            echo "GEMINI_API_KEY is configured in GitHub Actions (value hidden)."
          fi
          echo "Required production secrets are present (values are not printed)."
      - name: Deploy Firestore composite indexes
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");const key=String(process.env.FIREBASE_PRIVATE_KEY||"").replace(/\\n/g,"\n");const account={type:"service_account",project_id:process.env.FIREBASE_PROJECT_ID,private_key:key,client_email:process.env.FIREBASE_CLIENT_EMAIL,token_uri:"https://oauth2.googleapis.com/token"};fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,JSON.stringify(account),{mode:0o600});'
          if npx --yes firebase-tools@14.12.0 deploy --only firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive; then
            echo "Firestore index deployment completed."
          else
            echo "::warning::Firestore indexes were not deployed because the configured service account lacks index-management permission. Grant roles/datastore.indexAdmin to FIREBASE_CLIENT_EMAIL and rerun this workflow. Production runtime checkout checks will still run."
          fi
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Run security and type checks
        run: |
          npm run test:security
          npx tsc --noEmit
      - name: Build for Cloudflare
        run: npm run cf:build
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Firestore runtime secrets
        run: |
          printf '%s' "$FIREBASE_PROJECT_ID" | npx wrangler secret put FIREBASE_PROJECT_ID
          printf '%s' "$FIREBASE_CLIENT_EMAIL" | npx wrangler secret put FIREBASE_CLIENT_EMAIL
          printf '%s' "$FIREBASE_PRIVATE_KEY" | npx wrangler secret put FIREBASE_PRIVATE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      - name: Set application runtime secrets
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          printf '%s' "$ADMIN_SESSION_SECRET" | npx wrangler secret put ADMIN_SESSION_SECRET
          printf '%s' "$PAYMENT_ENCRYPTION_KEY" | npx wrangler secret put PAYMENT_ENCRYPTION_KEY
          put_optional_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "$name synced to Worker secret storage."
            else
              echo "$name not configured in GitHub Actions; related integration remains disabled."
            fi
          }
          put_optional_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put_optional_secret TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
          put_optional_secret TELEGRAM_ADMIN_USER_IDS "$TELEGRAM_ADMIN_USER_IDS"
          put_optional_secret TELEGRAM_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET"
          put_optional_secret GOOGLE_DRIVE_CLIENT_ID "$GOOGLE_DRIVE_CLIENT_ID"
          put_optional_secret GOOGLE_DRIVE_CLIENT_SECRET "$GOOGLE_DRIVE_CLIENT_SECRET"
          put_optional_secret GOOGLE_DRIVE_REFRESH_TOKEN "$GOOGLE_DRIVE_REFRESH_TOKEN"
          put_optional_secret GOOGLE_DRIVE_CLIENT_EMAIL "$GOOGLE_DRIVE_CLIENT_EMAIL"
          put_optional_secret GOOGLE_DRIVE_PRIVATE_KEY "$GOOGLE_DRIVE_PRIVATE_KEY"
          put_optional_secret GOOGLE_DRIVE_FOLDER_ID "$GOOGLE_DRIVE_FOLDER_ID"
          put_optional_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          printf '%s' "$PAYMENT_WEBHOOK_SECRET" | npx wrangler secret put PAYMENT_WEBHOOK_SECRET
          put_optional_secret MOBILE_MONEY_SMS_WEBHOOK_SECRET "$MOBILE_MONEY_SMS_WEBHOOK_SECRET"
          printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_USER_IDS: ${{ secrets.TELEGRAM_ADMIN_USER_IDS }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_CLIENT_EMAIL: ${{ secrets.GOOGLE_DRIVE_CLIENT_EMAIL }}
          GOOGLE_DRIVE_PRIVATE_KEY: ${{ secrets.GOOGLE_DRIVE_PRIVATE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          MOBILE_MONEY_SMS_WEBHOOK_SECRET: ${{ secrets.MOBILE_MONEY_SMS_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Verify deployed production health
        run: |
          set -euo pipefail
          URL="https://ecommerce-platform.masud50003.workers.dev/api/health"
          for attempt in $(seq 1 10); do
            code="$(curl --silent --show-error --output /tmp/mart-health.json --write-out '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ] && node -e 'const fs=require("node:fs");try{const x=JSON.parse(fs.readFileSync("/tmp/mart-health.json","utf8"));process.exit(x && x.status === "ok" ? 0 : 1)}catch{process.exit(1)}'; then
              echo "Production health endpoint returned status=ok."
              exit 0
            fi
            echo "Health check attempt $attempt/10 did not pass (HTTP ${code:-request-error}); waiting 10 seconds."
            sleep 10
          done
          echo "::error::Production health check failed after deployment. Inspect Cloudflare Worker logs and runtime secrets."
          cat /tmp/mart-health.json || true
          exit 1
      # Telegram is an optional integration: registration failure must not turn a healthy Worker deploy red.
      - name: Register store Telegram webhook and commands
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_WEBHOOK_SECRET:-}" ]; then
            echo "::warning::Telegram webhook registration skipped because TELEGRAM_BOT_TOKEN or TELEGRAM_WEBHOOK_SECRET is not configured."
            exit 0
          fi
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          URL="https://ecommerce-platform.masud50003.workers.dev/api/telegram/webhook"
          if ! curl --fail --silent --show-error -X POST "$API/setWebhook" -H 'content-type: application/json' \
            -d "{\"url\":\"$URL\",\"secret_token\":\"$TELEGRAM_WEBHOOK_SECRET\",\"allowed_updates\":[\"message\",\"callback_query\"],\"drop_pending_updates\":false}" | jq -e '.ok == true' > /dev/null; then
            echo "::warning::Telegram webhook registration failed; website deployment remains available. Re-run the integration setup after checking the bot token and Telegram API."
            exit 0
          fi
          if ! curl --fail --silent --show-error -X POST "$API/setMyCommands" -H 'content-type: application/json' \
            -d '{"commands":[{"command":"start","description":"Start"},{"command":"help","description":"Help"},{"command":"orders","description":"Recent orders"},{"command":"pending","description":"Pending orders"},{"command":"today","description":"Today summary"},{"command":"sales","description":"Sales report"},{"command":"stock","description":"Low stock"},{"command":"search","description":"Search orders"}]}' | jq -e '.ok == true' > /dev/null; then
            echo "::warning::Telegram commands could not be updated; website deployment remains available."
            exit 0
          fi
          if ! curl --fail --silent --show-error "$API/getWebhookInfo" | jq -e --arg url "$URL" '.ok == true and .result.url == $url' > /dev/null; then
            echo "::warning::Telegram webhook URL could not be verified; website deployment remains available."
            exit 0
          fi
          echo "Telegram webhook URL verified against the deployed Worker."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

      - name: Verify production storefront and Firestore readiness
        env:
          MART_PUBLIC_SITE_URL: ${{ vars.MART_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          # Prefer the canonical storefront origin configured in GitHub Actions Variables.
          # Fall back to the default Workers hostname when no custom origin is configured.
          BASE_URL="${MART_PUBLIC_SITE_URL:-https://ecommerce-platform.masud50003.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          echo "Checking deployed MART origin: $BASE_URL"
          for attempt in $(seq 1 8); do
            if curl --fail --silent --show-error --output /dev/null "$BASE_URL/"; then break; fi
            if [ "$attempt" -eq 8 ]; then echo "Storefront smoke test failed"; exit 1; fi
            sleep 10
          done
          curl --fail --silent --show-error "$BASE_URL/api/health" --output /tmp/health.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));if(d.status!=="ok"||d.database!=="reachable")throw new Error("Firestore readiness check failed");console.log("Firestore readiness check passed.")'
          curl --fail --silent --show-error "$BASE_URL/api/storefront/config" --output /tmp/storefront-config.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/storefront-config.json","utf8"));if(!d.settings||!Array.isArray(d.zones))throw new Error("Storefront config response is invalid");console.log("Storefront configuration smoke test passed.")'
          curl --fail --silent --show-error "$BASE_URL/api/products?limit=1" --output /tmp/products.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/products.json","utf8"));if(!Array.isArray(d.items)||typeof d.total!=="number"||typeof d.pages!=="number")throw new Error("Product catalogue response is invalid");console.log("Product catalogue API smoke test passed; returned total="+d.total+".")'
          curl --fail --silent --show-error "$BASE_URL/api/categories" --output /tmp/categories.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/categories.json","utf8"));if(!Array.isArray(d))throw new Error("Categories API response is invalid");console.log("Categories API smoke test passed; returned count="+d.length+".")'
          curl --fail --silent --show-error "$BASE_URL/api/payment-gateways" --output /tmp/payment-gateways.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/payment-gateways.json","utf8"));if(!Array.isArray(d))throw new Error("Payment gateway API response is invalid");console.log("Payment gateway API smoke test passed; enabled checkout methods="+d.length+".")'
          PRODUCT_ID="$(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/products.json","utf8"));process.stdout.write(String(d.items?.[0]?.id||""))')"
          if [ -n "$PRODUCT_ID" ]; then
            node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/products.json","utf8")).items[0];fs.writeFileSync("/tmp/quote-request.json",JSON.stringify({items:[{productId:p.id,quantity:1}]}))'
            curl --fail --silent --show-error -H 'content-type: application/json' --data-binary @/tmp/quote-request.json "$BASE_URL/api/checkout/quote" --output /tmp/checkout-quote.json
            node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/checkout-quote.json","utf8"));if(typeof d.total!=="number"||!Number.isFinite(d.total)||d.total<0)throw new Error("Checkout quote total is invalid");console.log("Live checkout quote smoke test passed; total is numeric and non-negative.")'
          else
            echo "::warning::Checkout quote smoke test skipped because no published products are available."
          fi
          PAYMENT_WEBHOOK_STATUS="$(curl --silent --show-error -o /tmp/payment-webhook-unauthorized.json -w '%{http_code}' -X POST "$BASE_URL/api/payments/webhook" -H 'content-type: application/json' --data '{}')"
          if [ "$PAYMENT_WEBHOOK_STATUS" != "401" ]; then echo "Payment webhook must reject requests without its secret (expected 401, got $PAYMENT_WEBHOOK_STATUS)"; exit 1; fi
          echo "Payment webhook unauthenticated-request guard passed."
          SMS_STATUS="$(curl --silent --show-error -o /tmp/personal-sms-response.json -w '%{http_code}' -X POST "$BASE_URL/api/webhooks/mobile-money-sms")"
          if [ "$SMS_STATUS" != "410" ]; then echo "Legacy personal-number SMS confirmation must remain disabled (expected 410, got $SMS_STATUS)"; exit 1; fi
          echo "Personal-number SMS auto-confirm remains safely disabled."
